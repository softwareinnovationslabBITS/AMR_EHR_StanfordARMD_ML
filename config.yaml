seed: 42

paths:
  dataset_dir: "dataset"
  models_dir: "models"

split:
  test_size: 0.15
  val_size: 0.15
  random_state: 42

# Imbalance-handling XGBoost experiments (manuscript Table 1)
xgboost_imbalance:
  dataset_dir: "dataset"
  cache_dir: "cache"
  saved_models_dir: "saved_models"
  results_dir: "results"
  random_state: 42
  test_size: 0.2
  device: "cuda"
  tree_method: "hist"
  n_jobs: -1
  n_estimators: 2000
  learning_rate: 0.02
  max_depth: 8
  subsample: 0.8
  colsample_bytree: 0.7
  eval_metric: "aucpr"
  early_stopping_rounds: 50
  smote_k_neighbors: 5
  kfold_n_splits: 3
  optuna_n_trials: 30
  optuna_n_splits: 3

# DL-feature-matched XGBoost workflow
xgboost:
  bundle_path: "dataset/amr_analysis_bundle.joblib"
  device: "cuda"
  tree_method: "hist"
  n_jobs: -1
  strategies:
    - baseline
    - class_weighted
    - smotenc
    - undersampling
    - threshold_optimized
    - fivefold_cv
    - optuna
  n_folds: 5
  n_optuna_trials: 30
  threshold_objective: "mcc"
  n_bootstraps: 2000

tabtransformer:
  epochs: 60
  batch_size: 512
  device: "cuda"
  patience: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  model_path: "models/tabtransformer/amr_model.pt"
  bundle_path: "dataset/amr_analysis_bundle.joblib"
